[program:hoard_rqworker]

command=/home/projects/hoard/hoard/.venv/bin/python /home/projects/hoard/hoard/hoard/manage.py scheduler_worker default --name "hoard-worker-%(ENV_JOURNAL_STREAM)s-%(process_num)s"

process_name=%(program_name)s-%(process_num)s

; If you want to run more than one worker instance, increase this
numprocs=2

directory = /home/projects/hoard/hoard/hoard
user = hoard
autostart = true
autorestart = true
startsecs = 5
environment=HOME=/home/projects/hoard,TMPDIR=/home/projects/hoard/hoard/tmp,LC_ALL=en_US.UTF-8

redirect_stderr = true
stdout_logfile = /home/projects/hoard/hoard/logs/rqworker.stdout.log
stdout_logfile_maxbytes = 1048576
stdout_logfile_backups = 10

stopsignal=TERM
