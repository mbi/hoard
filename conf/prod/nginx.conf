upstream  hoard_upstream {
    server unix:/home/mbi/Code/hoard/tmp/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    server_name hoard.mbi.me;
    location '/.well-known/acme-challenge' {
        default_type "text/plain";
        root        /var/tmp/letsencrypt-auto;
    }

    location / {
        return  301 https://hoard.mbi.me$request_uri;
    }
}

server {
    listen 443 ssl;
    proxy_set_header X-Forwarded-Protocol https;

    # !!!
    # UPDATE the list of accepted hostnames below (line 101)
    # !!!
    server_name hoard.mbi.me;
    access_log  /var/log/nginx/hoard.access.log;
    charset utf-8;
    server_tokens off;

    # Enable Gzip
    gzip  on;
    gzip_http_version 1.0;
    gzip_comp_level 2;
    gzip_min_length 1100;
    gzip_buffers     4 8k;
    gzip_proxied any;
    gzip_types text/css text/javascript text/xml text/plain text/x-component application/javascript application/json application/xml application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
    gzip_static on;

    gzip_proxied        expired no-cache no-store private auth;
    gzip_disable        "MSIE [1-6]\.";
    gzip_vary           on;

    ssl_certificate /home/mbi/Code/mbi.me.cert.pem;
    ssl_certificate_key /home/mbi/Code/mbi.me.key.pem;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:25m;


    # Diffie-Hellman parameter for DHE ciphersuites, recommended 2048 bits
    # openssl dhparam -out /etc/ssl/dhparam.pem 2048
    ssl_dhparam /etc/ssl/dhparam.pem;

    # modern configuration. tweak to your needs.
    ssl_protocols TLSV1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # HSTS (ngx_http_headers_module is required) (15768000 seconds = 6 months)
    add_header Strict-Transport-Security max-age=15768000;



    client_max_body_size 100M;
    root /home/mbi/Code/hoard/docroot;

    location .well-known/acme-challenge/ {
        root /home/mbi/Code/hoard/conf/prod/ssl/webroot;
    }

    location /static/ {
       root /home/mbi/Code/hoard/tmp;
       expires 30d;
    }

    location /media/ {
       root /home/mbi/Code/hoard/tmp;
       expires 30d;
    }


    location = /manifest.webmanifest {
        root /home/mbi/Code/hoard/docroot;
        types {} default_type "application/manifest+json";
        expires 3d;
    }

    location = /service-worker.js {
        root /home/mbi/Code/hoard/docroot;
        expires 3d;
    }

    # FIXME: update urls, sitemaps, domains in robots.txt
    location /robots.txt {
       root /home/mbi/Code/hoard/conf/prod;
       expires 3d;
    }

    location / {

        # auth_basic "Restricted Zone";
        # auth_basic_user_file /home/mbi/Code/hoard/conf/prod/htpasswd.conf;

        # https://stackoverflow.com/a/17477436/599706
        # FIXME: update these on hostname change
        if ($http_host !~* ^(hoard.mbi.me)$ ) {
          return 444;
        }

        proxy_pass_header Server;
        proxy_set_header Host $http_host;
        proxy_redirect off;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Scheme $scheme;
        proxy_connect_timeout 10;
        proxy_read_timeout 10;
        proxy_pass http://hoard_upstream;
    }
}
